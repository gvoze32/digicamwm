[workspace]
members = [".", "crates/core", "crates/wasm"]
resolver = "2"

[package]
name = "digicamwm"
version = "1.0.8"
description = "Digital Camera Watermarking Tool"
authors = ["gvoze32"]
license = "ISC"
repository = "https://github.com/gvoze32/digicamwm"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
digicamwm-core = { path = "crates/core", features = ["system-fonts", "parallel"] }
tauri = { version = "2.10.2", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2.5.3"
tauri-plugin-log = "2.8.0"
serde = { version = "1", features = ["derive"] }
log = "0.4"
rayon = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Image decoding dominates both debug runs and the browser build; keep it optimised.
[profile.dev.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
